<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDM 메모리 챌린지</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0.4); }
            50% { background-color: rgba(239, 68, 68, 0.8); }
        }
        .bg-emergency {
            animation: pulse-red 0.8s infinite;
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-effect {
            animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body id="body-bg" class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-center font-sans select-none overflow-hidden transition-colors duration-300">

    <!-- 메인 컨테이너 -->
    <div id="game-container" class="w-full max-w-md p-6 flex flex-col items-center justify-center relative z-10">
        
        <!-- 타이틀 / 상태바 -->
        <div id="header-section" class="text-center mb-6">
            <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 mb-2">EDM MEMORY</h1>
            <div id="status-bar" class="flex justify-center gap-6 text-sm font-semibold text-slate-400 hidden">
                <span id="round-display">라운드: 1 / 10</span>
                <span id="score-display">점수: 0</span>
            </div>
        </div>

        <!-- 메인 디스플레이 박스 -->
        <div id="display-box" class="w-full h-48 bg-slate-900/80 border-2 border-slate-800 rounded-2xl flex flex-col items-center justify-center shadow-2xl backdrop-blur-md mb-6 relative overflow-hidden">
            <div id="message-area" class="text-2xl font-bold text-center text-cyan-300 px-4">
                버튼을 눌러 게임을 시작하세요!
            </div>
            
            <!-- 입력 단계용 타이머 바 -->
            <div id="timer-bar-container" class="w-full absolute bottom-0 left-0 h-2 bg-slate-800 hidden">
                <div id="timer-bar" class="h-full bg-gradient-to-r from-cyan-500 to-fuchsia-500 w-full transition-all duration-100"></div>
            </div>
        </div>

        <!-- 입력 슬롯 (입력 단계에서 나타남) -->
        <div id="input-slots" class="flex flex-wrap justify-center gap-2 mb-6 min-h-[4rem]"></div>

        <!-- 사이드 코칭 메시지 -->
        <div id="coach-message" class="text-xs font-bold text-fuchsia-400 h-6 mb-4 text-center tracking-widest uppercase"></div>

        <!-- 컨트롤 버튼 -->
        <div id="control-area" class="w-full">
            <button id="start-btn" onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-fuchsia-600 rounded-xl font-extrabold text-lg shadow-lg shadow-cyan-500/30 hover:opacity-90 active:scale-95 transition-all">
                게임 시작
            </button>
        </div>

    </div>

    <script>
        let synth, bassSynth, drumKick, drumHiHat;
        let loopBGM;
        let isAudioInitialized = false;

        let currentRound = 1;
        let score = 0;
        let targetSequence = [];
        let playerInputIndex = 0;
        let currentSequenceLength = 3;
        
        let gameState = 'IDLE'; // IDLE, COUNTDOWN, SHOWING, INPUT, GAMEOVER, CLEAR
        let inputTimer = null;
        let timeLeft = 10;
        let timerInterval = null;

        const alphabetList = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'J', 'K', 'M', 'N', 'P', 'Q', 'R', 'S', 'T', 'U', 'V', 'W', 'X', 'Y', 'Z'];

        const coachTaunts = [
            ["빨리 외워!", "시간 없다!", "정신 차려!"],
            ["더 빨라진다!", "긴장해!", "놓치지 마!"],
            ["거의 다 왔다!", "끝까지 집중!", "아주 빨라!"]
        ];

        // 사운드 시스템 초기화 (모바일 터치 대응)
        async function initAudio() {
            if (isAudioInitialized) return;
            await Tone.start();
            
            // 신시사이저 및 드럼 구성 (EDM 스타일)
            synth = new Tone.Synth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.1 }
            }).toDestination();

            bassSynth = new Tone.MonoSynth({
                oscillator: { type: "square" },
                envelope: { attack: 0.05, decay: 0.2, sustain: 0.0, release: 0.1 },
                filterEnvelope: { attack: 0.01, decay: 0.2, baseFrequency: 200, octaves: 2 }
            }).toDestination();

            drumKick = new Tone.MembraneSynth({
                pitchDecay: 0.05,
                octaves: 4,
                oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 }
            }).toDestination();

            drumHiHat = new Tone.NoiseSynth({
                noise: { type: "white" },
                envelope: { attack: 0.005, decay: 0.05, sustain: 0, release: 0.05 }
            }).toDestination();

            // EDM 128 BPM 루프 비트 설정
            Tone.Transport.bpm.value = 128;
            
            let step = 0;
            loopBGM = new Tone.Loop(time => {
                if (step % 4 === 0) {
                    drumKick.triggerAttackRelease("C1", "8n", time);
                }
                if (step % 2 !== 0) {
                    drumHiHat.triggerAttackRelease("16n", time, 0.3);
                }
                if (step % 8 === 0) {
                    bassSynth.triggerAttackRelease("C2", "8n", time);
                } else if (step % 8 === 4) {
                    bassSynth.triggerAttackRelease("G1", "8n", time);
                }
                step = (step + 1) % 16;
            }, "8n");

            isAudioInitialized = true;
        }

        // 효과음 함수들
        function playBip(note = "C5", duration = "16n") {
            if (!isAudioInitialized) return;
            synth.triggerAttackRelease(note, duration);
        }

        function playCorrectSound() {
            if (!isAudioInitialized) return;
            synth.triggerAttackRelease("E5", "16n");
            setTimeout(() => synth.triggerAttackRelease("G5", "8n"), 80);
        }

        function playWrongSound() {
            if (!isAudioInitialized) return;
            bassSynth.triggerAttackRelease("C1", "4n");
        }

        // 비프음 기반 카운트다운 (음성 합성 완전 배제)
        async function playBeepCountdown(callback) {
            gameState = 'COUNTDOWN';
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('status-bar').classList.remove('hidden');
            
            const msgArea = document.getElementById('message-area');
            
            for (let i = 3; i > 0; i--) {
                msgArea.innerHTML = `<span class="text-5xl font-black text-cyan-400 pop-effect">${i}</span>`;
                playBip("C4", "8n");
                await new Promise(r => setTimeout(r, 1000));
            }
            
            msgArea.innerHTML = `<span class="text-4xl font-black text-fuchsia-400 pop-effect">시작!</span>`;
            playBip("G5", "4n");
            await new Promise(r => setTimeout(r, 600));
            
            callback();
        }

        async function startGame() {
            await initAudio();
            Tone.Transport.start();
            loopBGM.start(0);

            currentRound = 1;
            score = 0;
            currentSequenceLength = 3;
            updateStatusBar();
            
            startRound();
        }

        function updateStatusBar() {
            document.getElementById('round-display').innerText = `라운드: ${currentRound} / 10`;
            document.getElementById('score-display').innerText = `점수: ${score}`;
        }

        function startRound() {
            gameState = 'SHOWING';
            playerInputIndex = 0;
            document.getElementById('input-slots').innerHTML = '';
            document.getElementById('coach-message').innerText = '';
            
            // 라운드별 속도 계산 (1라운드 1000ms -> 10라운드 450ms)
            let showInterval = Math.max(450, 1050 - (currentRound * 65));

            // 랜덤 시퀀스 생성
            targetSequence = [];
            let tempPool = [...alphabetList];
            for(let i=0; i<currentSequenceLength; i++) {
                let idx = Math.floor(Math.random() * tempPool.length);
                targetSequence.push(tempPool[idx]);
            }

            let index = 0;
            const msgArea = document.getElementById('message-area');

            const showIntervalId = setInterval(() => {
                if (index < targetSequence.length) {
                    msgArea.innerHTML = `<span class="text-6xl font-black text-white pop-effect">${targetSequence[index]}</span>`;
                    playBip("A4", "16n");
                    index++;
                } else {
                    clearInterval(showIntervalId);
                    setTimeout(() => {
                        startInputPhase();
                    }, 500);
                }
            }, showInterval);
        }

        function startInputPhase() {
            gameState = 'INPUT';
            document.getElementById('message-area').innerHTML = `<span class="text-xl font-bold text-cyan-300">순서대로 입력하세요!</span>`;
            
            // 타이머바 및 입력 슬롯 생성
            timeLeft = 10;
            document.getElementById('timer-bar-container').classList.remove('hidden');
            updateTimerBar();

            const slotsContainer = document.getElementById('input-slots');
            slotsContainer.innerHTML = '';
            for(let i=0; i<targetSequence.length; i++) {
                slotsContainer.innerHTML += `<div id="slot-${i}" class="w-10 h-12 bg-slate-900 border-2 border-slate-700 rounded-lg flex items-center justify-center text-xl font-bold text-slate-500 shadow-inner">_</div>`;
            }

            // 코칭 및 타이머 루프 시작
            setRandomCoachTaunt();
            
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if(timeLeft <= 0) {
                    timeLeft = 0;
                    clearInterval(timerInterval);
                    gameOver("시간 초과!");
                    return;
                }
                updateTimerBar();

                // 5초 이하 경고 배경 및 비프음 카운트다운
                if (timeLeft <= 5.0) {
                    document.getElementById('body-bg').classList.add('bg-emergency');
                    if (Math.abs(timeLeft - Math.round(timeLeft)) < 0.05) {
                        playBip("C6", "32n");
                    }
                }
            }, 100);

            // 키보드 입력 리스너 등록
            window.addEventListener('keydown', handleKeyInput);
        }

        function updateTimerBar() {
            let percent = (timeLeft / 10) * 100;
            document.getElementById('timer-bar').style.width = `${percent}%`;
        }

        function setRandomCoachTaunt() {
            let tier = currentRound <= 3 ? 0 : currentRound <= 7 ? 1 : 2;
            let pool = coachTaunts[tier];
            let taunt = pool[Math.floor(Math.random() * pool.length)];
            document.getElementById('coach-message').innerText = `🔥 ${taunt}`;
        }

        function handleKeyInput(e) {
            if (gameState !== 'INPUT') return;
            let keyPressed = e.key.toUpperCase();
            
            if (alphabetList.includes(keyPressed)) {
                processInput(keyPressed);
            }
        }

        function processInput(char) {
            let expectedChar = targetSequence[playerInputIndex];
            
            if (char === expectedChar) {
                // 정답 맞춤
                playCorrectSound();
                let slot = document.getElementById(`slot-${playerInputIndex}`);
                slot.innerText = char;
                slot.className = "w-10 h-12 bg-cyan-950 border-2 border-cyan-400 rounded-lg flex items-center justify-center text-xl font-bold text-cyan-300 shadow-lg pop-effect";
                
                score += 100 * currentRound;
                updateStatusBar();
                playerInputIndex++;

                if (playerInputIndex === targetSequence.length) {
                    // 라운드 클리어
                    cleanupRound();
                    if (currentRound >= 10) {
                        gameClear();
                    } else {
                        currentRound++;
                        currentSequenceLength++;
                        document.getElementById('message-area').innerHTML = `<span class="text-2xl font-bold text-emerald-400">라운드 클리어! 🎉</span>`;
                        setTimeout(startRound, 1500);
                    }
                }
            } else {
                // 오답
                playWrongSound();
                cleanupRound();
                gameOver("틀렸습니다! 게임 오버");
            }
        }

        function cleanupRound() {
            clearInterval(timerInterval);
            window.removeEventListener('keydown', handleKeyInput);
            document.getElementById('timer-bar-container').classList.add('hidden');
            document.getElementById('body-bg').classList.remove('bg-emergency');
            document.getElementById('coach-message').innerText = '';
        }

        function gameOver(reason) {
            gameState = 'GAMEOVER';
            Tone.Transport.stop();
            if(loopBGM) loopBGM.stop();

            document.getElementById('message-area').innerHTML = `
                <div class="text-center">
                    <div class="text-xl font-bold text-rose-500 mb-1">${reason}</div>
                    <div class="text-sm text-slate-400">최종 점수: ${score}점</div>
                </div>
            `;
            
            let btn = document.getElementById('start-btn');
            btn.innerText = "다시 도전하기";
            btn.classList.remove('hidden');
        }

        function gameClear() {
            gameState = 'CLEAR';
            Tone.Transport.stop();
            if(loopBGM) loopBGM.stop();

            document.getElementById('message-area').innerHTML = `
                <div class="text-center">
                    <div class="text-2xl font-black text-amber-400 mb-1">모든 라운드 돌파 완료! 🏆</div>
                    <div class="text-sm text-slate-300">최종 스코어: ${score}점</div>
                </div>
            `;

            let btn = document.getElementById('start-btn');
            btn.innerText = "처음부터 다시하기";
            btn.classList.remove('hidden');
        }
    </script>
</body>
</html>
